<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15201b">
<title>Padel Runner</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7wn46+PC90ZXh0Pjwvc3ZnPg==">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* STERLING brand pantones */
    --sterling-green:#44695A;
    --sterling-orange:#e57200;
    --sterling-sage:#a7bdb1;
    --sterling-amber:#ffb25b;
    --sterling-grey:#97999a;
    --sterling-cream:#d7d2cb;
    --sterling-taupe:#aca39a;
    --sterling-mist:#d9d9d6;

    --dark:#15201b;
    --dark2:#1d2b24;
    --panel:#1d2b24;
    --panel2:#243a30;
    --border:#33493f;
    --text:var(--sterling-mist);
    --muted:var(--sterling-grey);
    --accent:var(--sterling-orange);
    --accent-dark:#b85c00;
    --accent-light:var(--sterling-amber);
    --sage:var(--sterling-sage);
    --ink:#241400;
    --danger:#d0554a;
    --radius:14px;
  }
  /* Sakura theme — dark cherry-blossom palette: white/near-white for active
     elements, pink-violet for inactive ones, glassy translucent surfaces.
     Panel opacity/blur/glow pulled ~25% back toward the original theme's
     flatter, more opaque contrast — still glass, just less washed-out. */
  :root[data-theme="sakura"]{
    --dark:#150c17;
    --dark2:#20101f;
    --panel:rgba(33,16,38,.64);
    --panel2:rgba(44,23,48,.66);
    --border:rgba(216,176,222,.32);
    --text:#f3e4f5;
    --muted:#cfc2dd;
    --accent:#ff2f87;
    --accent-dark:#b81e63;
    --accent-light:#ff8fc0;
    --sage:#ffb3d1;
    --ink:#241029;
    --danger:#b05374;
  }
  :root[data-theme="sakura"] body{
    background:
      radial-gradient(circle at 10% 15%, rgba(236,83,133,.21), transparent 42%),
      radial-gradient(circle at 90% 4%, rgba(190,140,235,.17), transparent 48%),
      radial-gradient(circle at 50% 108%, rgba(236,83,133,.12), transparent 55%),
      #150c17;
    background-attachment:fixed;
  }
  :root[data-theme="sakura"] .hero,
  :root[data-theme="sakura"] .card,
  :root[data-theme="sakura"] .match,
  :root[data-theme="sakura"] .format-btn,
  :root[data-theme="sakura"] .rec-box,
  :root[data-theme="sakura"] input,
  :root[data-theme="sakura"] select,
  :root[data-theme="sakura"] button:not(.primary):not(.accent):not(.warn){
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  :root[data-theme="sakura"] .card,
  :root[data-theme="sakura"] .match,
  :root[data-theme="sakura"] .format-btn,
  :root[data-theme="sakura"] .rec-box{
    box-shadow:0 6px 24px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06);
  }
  :root[data-theme="sakura"] .hero{
    background:linear-gradient(135deg, rgba(38,18,30,.66), rgba(21,12,23,.55));
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{height:100%;}
  body{
    margin:0; background-color:var(--dark); color:var(--text);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',sans-serif; text-transform:uppercase; letter-spacing:.01em; font-weight:700;
  }
  #app{min-height:100%;}

  .hero{
    background:linear-gradient(135deg, var(--dark2), var(--dark)); padding:32px 48px; display:flex; align-items:center; justify-content:space-between; gap:24px;
    border-bottom:4px solid var(--accent);
  }
  .hero h1{font-size:30px; margin:0 0 6px; color:var(--text); font-weight:700; line-height:1.1; cursor:pointer; border-bottom:1px dashed transparent;}
  .hero h1:hover{border-bottom-color:var(--muted);}
  .hero .sub{font-size:14px; color:var(--muted); font-weight:400;}
  .hero .actions{display:flex; gap:10px; align-items:center;}
  .hero-actions-col{display:flex; flex-direction:column; align-items:flex-end; gap:8px;}
  .hero-credit{font-size:10px; color:var(--muted); opacity:.5; letter-spacing:.02em; text-decoration:none;}
  .hero-credit:hover{opacity:.8;}
  .hero-club-trigger{cursor:pointer; border-bottom:1px dashed transparent;}
  .hero-club-trigger:hover{border-bottom-color:var(--muted); color:var(--text);}
  .hero-club-empty{font-style:italic; opacity:.75;}
  .hero-edit-input{
    font-family:'Manrope',sans-serif; background:var(--panel2); color:var(--text);
    border:1px solid var(--accent); border-radius:8px; padding:4px 9px;
  }
  .hero-edit-title{font-family:'Space Grotesk',sans-serif; text-transform:uppercase; letter-spacing:.01em; font-weight:700; font-size:26px; width:min(560px,100%);}
  .hero-edit-club{font-size:13px; width:220px; max-width:100%;}
  .badge{
    background:var(--accent); color:var(--ink); font-weight:700;
    padding:10px 18px; border-radius:10px; font-size:13px; white-space:nowrap; text-transform:uppercase; letter-spacing:.03em;
  }
  .theme-switch{
    position:relative; width:46px; height:26px; flex:0 0 auto; padding:0; margin:0;
    background:var(--panel2); border:1px solid var(--border); border-radius:999px;
    cursor:pointer; text-transform:none;
  }
  .theme-switch .thumb{
    position:absolute; top:2px; left:2px; height:20px; width:20px; border-radius:50%;
    background:var(--accent); display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1; transition:transform .25s ease, background .25s ease;
  }
  .theme-switch[data-active="sakura"] .thumb{transform:translateX(20px);}
  .container{max-width:1260px; margin:0 auto; padding:28px 48px 60px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px; margin-bottom:18px;}
  label{font-size:11.5px; color:var(--muted); display:block; margin-bottom:6px; letter-spacing:.04em; text-transform:uppercase; font-weight:600;}
  .info-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:15px; height:15px; padding:0; margin-left:3px; vertical-align:middle;
    border-radius:50%; background:transparent; border:1.5px solid var(--muted); color:var(--muted);
    font-family:Georgia,'Times New Roman',serif; font-style:normal; font-size:10.5px; font-weight:700;
    letter-spacing:normal; text-transform:none; line-height:1; cursor:pointer;
  }
  .info-icon:hover, .info-icon:focus-visible{border-color:var(--accent); color:var(--accent);}
  .field{margin-bottom:16px;}
  .name-field input{max-width:420px;}
  input,select{
    font-family:'Manrope',sans-serif; background:var(--panel2); color:var(--text);
    border:1px solid var(--border); border-radius:9px; padding:10px 12px; font-size:14px; width:100%;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  button{
    font-family:'Space Grotesk',sans-serif; border:none; border-radius:9px; padding:11px 18px;
    font-size:13px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; cursor:pointer;
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
  }
  button.primary{background:var(--accent); color:var(--ink); border:none;}
  button.primary:hover{background:var(--accent);}
  button.accent{background:var(--accent); color:var(--ink); border:none;}
  button.accent:hover{background:var(--accent-light);}
  button.warn{background:var(--danger); color:#2a0906; border:none;}
  button.small{padding:7px 13px; font-size:11.5px;}
  button.ghost{background:transparent;}
  button:active{opacity:.8;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:end;}
  .grid4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:16px; align-items:end;}
  .player-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;}
  .player-row{display:flex; gap:8px; align-items:center;}
  .player-row input{flex:1;}
  .rm{padding:9px 12px; background:var(--panel2); border-radius:9px; color:var(--danger); border:1px solid var(--border); font-size:14px; line-height:1;}
  .hint{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.55;}
  .rec-box{background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-top:10px; font-size:13px;}
  .rec-box b{color:var(--accent);}
  .setup-actions{display:flex; gap:12px; align-items:center; margin-top:6px;}
  .format-toggle{display:flex; gap:10px;}
  .format-btn{
    flex:1; text-align:left; text-transform:none; letter-spacing:normal; font-weight:400;
    background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:14px 16px;
  }
  .format-btn .fmt-name{
    display:block; font-family:'Space Grotesk',sans-serif; font-weight:700; text-transform:uppercase;
    letter-spacing:.02em; font-size:14px; color:var(--text); margin-bottom:5px;
  }
  .format-btn .fmt-desc{display:block; font-size:11.5px; color:var(--muted); line-height:1.5; white-space:normal;}
  .format-btn.active{border-color:var(--accent); background:var(--panel);}
  .format-btn.active .fmt-name{color:var(--accent);}

  .layout{display:grid; grid-template-columns:340px 1fr; gap:24px; align-items:start;}
  .section-title{font-size:12.5px; font-weight:700; color:var(--accent); margin-bottom:14px; letter-spacing:.05em; text-transform:uppercase; display:flex; justify-content:space-between; align-items:center;}
  .lb-row{display:flex; align-items:center; padding:10px 8px; border-radius:9px; gap:6px;}
  .lb-row:nth-child(odd){background:var(--panel2);}
  .lb-rank{width:20px; color:var(--muted); font-size:13px; font-weight:700;}
  .lb-name{flex:1; font-weight:600; font-size:13.5px;}
  .lb-stats{font-size:11.5px; color:var(--muted); text-align:right; min-width:78px;}
  .lb-points{font-weight:800; color:var(--accent); font-size:16px; margin-left:6px; min-width:34px; text-align:right;}

  .leaderboard-card{
    position:sticky; top:14px; max-height:calc(100vh - 28px);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .leaderboard-card #leaderboard{overflow-y:auto; flex:1; padding-right:4px; margin:0 -4px;}
  .leaderboard-card #leaderboard::-webkit-scrollbar{width:6px;}
  .leaderboard-card #leaderboard::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

  .round-block{margin-bottom:20px;}
  .round-title{font-size:12.5px; font-weight:700; color:var(--accent); margin-bottom:10px; text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:8px; justify-content:space-between;}
  .round-title .left{display:flex; align-items:center; gap:8px;}
  .played-badge{font-size:10px; background:var(--accent); color:var(--ink); padding:3px 8px; border-radius:6px; font-weight:700;}
  .del-round{background:transparent; border:1px solid var(--border); color:var(--danger); padding:4px 9px; font-size:10.5px; border-radius:6px;}
  .matches-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .match{border:1px solid var(--border); border-radius:11px; padding:12px 14px; background:var(--panel2);}
  .match .court{font-size:10.5px; color:var(--muted); margin-bottom:8px; font-weight:700; letter-spacing:.03em;}
  .teams{display:flex; align-items:center; gap:8px;}
  .team{flex:1; font-size:13px; font-weight:500; line-height:1.3;}
  .team.ko-winner{color:var(--accent); font-weight:800;}
  .score-input{width:52px; text-align:center; padding:8px 4px; font-weight:700; border-color:var(--border);}
  .score-input:focus{border-color:var(--accent);}
  .vs{color:var(--muted); font-size:12px;}
  .opp-score{display:inline-block; width:34px; text-align:center; font-weight:700; color:var(--muted);}
  .bench{font-size:11.5px; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:24px 0;}
  .add-round-row{display:flex; justify-content:center; margin-top:6px; margin-bottom:24px;}

  .round-choice{width:100%; margin-bottom:24px;}
  .round-choice-title{font-size:12.5px; font-weight:700; color:var(--accent); margin-bottom:10px; text-transform:uppercase; letter-spacing:.05em; text-align:center;}
  .round-choice-option{display:flex; flex-direction:column;}
  .rc-label{font-family:'Space Grotesk',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:12px; color:var(--accent); margin-bottom:10px;}
  .rc-lines{display:flex; flex-direction:column; gap:7px; margin-bottom:4px;}
  .rc-line{font-size:12.5px; line-height:1.4;}
  .rc-line .court-no{color:var(--muted); font-weight:700; margin-right:6px;}
  .rc-line .vs{margin:0 5px;}
  .round-choice-option .rc-pick{margin-top:12px;}

  .podium-wrap{margin-bottom:26px;}
  .podium-title{font-size:12.5px; font-weight:700; color:var(--accent); margin-bottom:16px; letter-spacing:.06em; text-transform:uppercase; text-align:center;}
  .podium{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; align-items:end;}
  .podium-card{
    border-radius:16px; padding:22px 16px 20px; text-align:center; position:relative;
    border:1px solid rgba(255,255,255,.12);
  }
  .podium-card .medal{font-size:38px; line-height:1; margin-bottom:8px; display:block;}
  .podium-card .rank-label{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; opacity:.85; margin-bottom:6px;}
  .podium-card .name{font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:.01em; margin-bottom:6px; line-height:1.2;}
  .podium-card .pts{font-size:26px; font-weight:800; margin-bottom:2px;}
  .podium-card .meta{font-size:11.5px; opacity:.8; font-weight:500;}
  .podium-gold{
    background:linear-gradient(160deg,#e9c766,#a97f1f); color:#2b1c02;
    transform:translateY(-14px); box-shadow:0 10px 26px rgba(212,175,55,.28);
  }
  .podium-silver{
    background:linear-gradient(160deg,#dfe3e6,#9aa1a8); color:#1c2024;
    box-shadow:0 8px 20px rgba(180,190,198,.18);
  }
  .podium-bronze{
    background:linear-gradient(160deg,#d79a5e,#93552a); color:#2a1607;
    box-shadow:0 8px 20px rgba(150,90,40,.2);
  }
  .lb-row.top1{background:linear-gradient(90deg, rgba(233,199,102,.22), transparent); border-left:3px solid #d4af37;}
  .lb-row.top2{background:linear-gradient(90deg, rgba(223,227,230,.16), transparent); border-left:3px solid #b9c1c9;}
  .lb-row.top3{background:linear-gradient(90deg, rgba(215,154,94,.16), transparent); border-left:3px solid #b06a35;}
  .lb-name{cursor:pointer; border-bottom:1px dashed transparent;}
  .lb-name:hover{border-bottom-color:var(--muted);}
  .lb-name-input{width:auto; padding:4px 6px; font-size:13.5px; font-weight:600;}
  .lb-name-col{flex:1; min-width:0;}
  .lb-points-col{text-align:right;}
  .lb-sub{font-size:10.5px; color:var(--muted); margin-top:2px; white-space:nowrap;}
  .lb-sub .diff-pos{color:var(--sage);}
  .lb-sub .diff-neg{color:var(--danger);}
  .lb-add-row{margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
  .lb-remove{background:transparent; border:none; color:var(--muted); font-size:12px; padding:4px 6px; margin-left:2px; cursor:pointer; line-height:1; flex:0 0 auto;}
  .lb-remove:hover{color:var(--danger);}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal-box{background:var(--panel); border:1px solid var(--border); border-radius:16px; max-width:560px; width:100%; max-height:85vh; overflow-y:auto; padding:26px 28px;}
  .modal-box h2{margin:0 0 16px; font-size:18px; color:var(--accent);}
  .modal-box h3{margin:20px 0 6px; font-size:12.5px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em;}
  .modal-box h3:first-of-type{margin-top:0;}
  .modal-box p{margin:0 0 4px; font-size:13px; color:var(--text); line-height:1.6;}
  .modal-box .modal-close{position:absolute; top:20px; right:20px;}
  .modal-box-wrap{position:relative;}

  .ko-card{border:1px solid var(--accent-dark);}
  .ko-card .section-title{color:var(--accent);}

  /* ---------- RESPONSIVE: TABLET / LANDSCAPE PHONE ---------- */
  @media (max-width: 1000px){
    .container{padding:24px 24px 50px;}
    .hero{padding:24px 24px;}
    .layout{grid-template-columns: 280px 1fr;}
  }

  /* ---------- RESPONSIVE: PORTRAIT PHONE ---------- */
  @media (max-width: 680px){
    .hero{
      padding:18px 16px; flex-direction:column; align-items:flex-start; gap:14px;
    }
    .hero h1{font-size:20px;}
    .hero .sub{font-size:12.5px;}
    .hero-edit-title{font-size:18px;}
    .hero-edit-club{font-size:16px; width:160px;} /* 16px avoids iOS auto-zoom on focus */
    .hero .actions{flex-wrap:wrap; gap:8px; width:100%;}
    .hero-actions-col{width:100%;}
    .hero .actions button{flex:0 0 auto;}
    .badge{font-size:11px; padding:8px 14px;}
    .container{padding:16px 14px 60px;}
    .card{padding:16px 16px; border-radius:12px;}
    .grid2, .grid4{grid-template-columns:1fr 1fr;}
    .player-grid{grid-template-columns:1fr;}
    .format-toggle{flex-direction:column;}
    .layout{grid-template-columns:1fr;}
    .leaderboard-card{position:sticky; top:8px; max-height:46vh;}
    .matches-grid{grid-template-columns:1fr;}
    .podium{grid-template-columns:1fr; gap:10px;}
    .podium-gold{transform:none;}
    button{padding:12px 16px; font-size:13px;}
    button.small{padding:10px 14px; font-size:12px;}
    input,select{font-size:16px; padding:12px 12px;} /* 16px avoids iOS auto-zoom on focus */
    .score-input{width:56px; padding:10px 4px; font-size:16px;}
    .lb-row{flex-wrap:wrap; padding:12px 8px;}
    .lb-stats{min-width:auto;}
    .round-title{flex-wrap:wrap; gap:6px;}
    .del-round{padding:6px 10px;}
  }

  /* ---------- RESPONSIVE: LANDSCAPE PHONE (short height, wide enough for 2 columns) ---------- */
  /* Mirrors the desktop two-column layout as closely as possible: score entry stays
     on the left (wide), leaderboard moves to the right (narrow), and the action
     buttons relocate into a fixed bottom bar so the short viewport isn't eaten by
     header chrome. */
  @media (max-height: 500px) and (min-width: 620px){
    body{padding-bottom:0;}
    .hero{padding:10px 20px 10px;}
    .hero h1{font-size:18px; margin-bottom:2px;}
    .hero .sub{font-size:11px;}
    .badge{font-size:10px; padding:6px 12px;}
    .container{padding:14px 20px 78px;}
    .card{padding:14px 16px;}

    .layout{grid-template-columns: 1fr 260px; gap:16px;}
    #roundsCol{order:1;}
    .leaderboard-card{
      order:2; position:sticky; top:8px;
      max-height:calc(100vh - 100px);
    }
    .matches-grid{grid-template-columns:1fr 1fr;}

    /* Action buttons become a fixed bottom bar, freeing the header */
    .hero .actions{
      position:fixed; left:0; right:0; bottom:0; z-index:50;
      background:var(--dark2); border-top:2px solid var(--accent);
      padding:8px 12px calc(8px + env(safe-area-inset-bottom));
      display:flex; gap:6px; overflow-x:auto; flex-wrap:nowrap;
      justify-content:flex-start;
    }
    .hero .actions button{flex:0 0 auto; white-space:nowrap; padding:9px 13px; font-size:11.5px;}
    .hero .actions::-webkit-scrollbar{display:none;}

    input,select{font-size:16px;} /* avoid iOS auto-zoom */
  }

  /* Very narrow phones (SE, older models) */
  @media (max-width: 380px){
    .grid4{grid-template-columns:1fr 1fr;}
    .hero h1{font-size:18px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = 'sterling_americano_state_v3';
// build fingerprint, base64 — see console
const _bf = 'UGFkZWwgUnVubmVyIC0gRGV2ZWxvcGVkIGJ5IE9sZWcgUHJhY2h1aw==';


function loadState(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveState(){

// Swaps a hero display element for a plain input, focused and pre-filled;
// commits back to state on blur/Enter and re-renders (which naturally
// restores the element's normal, non-input styling), or discards on Escape.
function makeHeroFieldEditable(el, {getValue, setValue, inputClass}){
  if(!el) return;
  el.addEventListener('click', e=>{
    e.stopPropagation();
    const input = document.createElement('input');
    input.type = 'text';
    input.value = getValue();
    input.className = inputClass;
    el.replaceWith(input);
    input.focus(); input.select();
    let done = false;
    const commit = ()=>{
      if(done) return;
      done = true;
      setValue(input.value.trim());
      saveState();
      render();
    };
    input.addEventListener('blur', ()=> setTimeout(commit, 120));
    input.addEventListener('keydown', ev=>{
      if(ev.key === 'Enter') commit();
      if(ev.key === 'Escape'){ done = true; render(); }
    });
  });
}

/* ---------- ROUND RECOMMENDATION ---------- */
function estimateMinutesPerRound(points, players, courts){
  const base = 10.9 * (points/16);
  const maxPlayable = courts*4;
  const benchRatio = players > maxPlayable ? (players - maxPlayable)/players : 0;
  const overhead = benchRatio * 1.6;
  return base + overhead;
}
function recommendRounds(points, players, courts, sessionMinutes){
  const perRound = estimateMinutesPerRound(points, players, courts);
  const rounds = Math.max(1, Math.round(sessionMinutes / perRound));
  return {rounds, perRound};
}

/* ---------- SCHEDULING ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// Attempts to pair up every player in `players` with a partner they have NEVER
// partnered before (partnerCount===0). Uses randomised greedy retries, which
// reliably finds a valid perfect matching when one exists for this group size.
function findFreshPerfectMatching(players, partnerCount, trials){
  for(let t=0; t<trials; t++){
    const avail = shuffle(players.slice());
    const pairs = [];
    let failed = false;
    while(avail.length){
      const p = avail.shift();
      const candidates = avail.filter(c => partnerCount[p][c] === 0);
      if(candidates.length === 0){ failed = true; break; }
      const partner = shuffle(candidates)[0];
      pairs.push([p, partner]);
      avail.splice(avail.indexOf(partner), 1);
    }
    if(!failed) return pairs;
  }
  return null;
}

// Given the round's teams (pairs), groups them into courts of 2 teams each,
// minimising repeated opponents. Opponent freshness is only ever optimised
// among partner pairs that are already fixed — partner freshness always
// takes priority over opponent freshness, never the other way round.
function pairUpCourts(pairs, opponentCount, trials){
  let best = null, bestScore = Infinity;
  for(let t=0; t<trials; t++){
    const shuffled = shuffle(pairs);
    let totalScore = 0;
    const courts = [];
    for(let i=0;i<shuffled.length;i+=2){
      const teamA = shuffled[i], teamB = shuffled[i+1];
      const [a1,a2]=teamA, [b1,b2]=teamB;
      const score = opponentCount[a1][b1]+opponentCount[a1][b2]+opponentCount[a2][b1]+opponentCount[a2][b2];
      totalScore += score;
      courts.push({teamA, teamB});
    }
    if(totalScore < bestScore){ bestScore = totalScore; best = courts; }
  }
  return best;
}

// Picks who sits out this round. Players who have rested least are the most
// likely to rest now (fairness), but the exact tie-break is re-rolled on
// every call so different attempts can try different rest groups.
function pickBenchSubset(candidates, benchNeeded, benchCount){
  const order = shuffle(candidates.slice()).sort((a,b)=> benchCount[a]-benchCount[b]);
  return order.slice(0, benchNeeded);
}

function applyRoundCounts(round, benchCount, partnerCount, opponentCount){
  round.bench.forEach(p=> benchCount[p]++);
  round.matches.forEach(m=>{
    const [a1,a2]=m.teamA, [b1,b2]=m.teamB;
    partnerCount[a1][a2]++; partnerCount[a2][a1]++;
    partnerCount[b1][b2]++; partnerCount[b2][b1]++;
    opponentCount[a1][b1]++; opponentCount[b1][a1]++;
    opponentCount[a1][b2]++; opponentCount[b2][a1]++;
    opponentCount[a2][b1]++; opponentCount[b1][a2]++;
    opponentCount[a2][b2]++; opponentCount[b2][a2]++;
  });
}

function cloneRound(round){
  return {
    matches: round.matches.map(m=>({court: m.court, teamA: m.teamA.slice(), teamB: m.teamB.slice()})),
    bench: round.bench.slice()
  };
}

/* ---------- MEXICANO ROTATION ----------
   Unlike Americano (fixed schedule, partners never repeat until forced to),
   Mexicano is played one round at a time: after every round players are
   re-ranked by total points and regrouped into fresh blocks of 4, so the
   pairing itself is standings-driven rather than history-driven. Round 1
   has no standings yet, so it's seeded with a random order instead. */

// Splits a best-to-worst player order into blocks of 4 — 1st+4th vs 2nd+3rd
// within each block — so the closest-matched foursome always shares a
// court. Shared by Mexicano rounds and Americano's "balanced" round option.
function foursomeMatches(rankedPlaying){
  const matches = [];
  for(let i=0; i<rankedPlaying.length; i+=4){
    const [r1,r2,r3,r4] = rankedPlaying.slice(i, i+4);
    matches.push({court: (i/4)+1, teamA:[r1,r4], teamB:[r2,r3]});
  }
  return matches;
}

// Builds one round from a best-to-worst player order. Players are benched
// on the same fairness rotation as Americano, then whoever's left is split
// into ranked foursomes.
function generateMexicanoRound(n, numCourts, benchCount, rankOrder){
  const maxPlayable = numCourts*4;
  let slots = Math.min(n, maxPlayable);
  slots = slots - (slots % 4);
  const benchNeeded = n - slots;

  const benched = pickBenchSubset(rankOrder, benchNeeded, benchCount);
  const benchedSet = new Set(benched);
  const playing = rankOrder.filter(p=>!benchedSet.has(p));

  const round = {matches: foursomeMatches(playing), bench: benched};
  round.bench.forEach(p=> benchCount[p]++);
  return round;
}

// Americano's "balanced by standings" alternative for a round: same bench
// as the partner-rotation option (whoever sits stays the same either way),
// but the players actually on court are grouped into ranked foursomes
// (1st+4th vs 2nd+3rd) instead of by fresh-partner history.
function generateBalancedRoundWithBench(bench, rankOrder){
  const benchedSet = new Set(bench);
  const playing = rankOrder.filter(p=>!benchedSet.has(p));
  return {matches: foursomeMatches(playing), bench: bench.slice()};
}

// Tries to build a round where every partnership is brand new (nobody plays
// with a partner they've had before). Tries several different rest groups,
// since a round that looks impossible with one rest group can be easy with
// another. Returns null once no rest group yields a fully fresh round —
// i.e. the partner rotation has been exhausted.
function generateFreshRound(candidates, numCourts, benchCount, partnerCount, opponentCount, benchTrials){
  const n = candidates.length;
  const maxPlayable = numCourts*4;
  let slots = Math.min(n, maxPlayable);
  slots = slots - (slots % 4);
  const benchNeeded = n - slots;

  for(let bt=0; bt<(benchTrials||25); bt++){
    const benched = pickBenchSubset(candidates, benchNeeded, benchCount);
    const benchedSet = new Set(benched);
    const playing = candidates.filter(p=>!benchedSet.has(p));

    const pairs = findFreshPerfectMatching(playing, partnerCount, 400);
    if(!pairs) continue;

    const courts = pairUpCourts(pairs, opponentCount, 600);
    const round = {
      bench: benched,
      matches: courts.map((c,idx)=>({court: idx+1, teamA:c.teamA, teamB:c.teamB}))
    };
    applyRoundCounts(round, benchCount, partnerCount, opponentCount);
    return round;
  }
  return null;
}

// Builds the full schedule. Partner rotation always wins over opponent
// rotation: every round is generated fresh-partners-only for as long as
// that's possible. Once every partner combination has been used up (the
// rotation is exhausted), instead of degrading to repeated partners, the
// exact same rotation is simply replayed from Round 1 onward.
function buildSchedule(n, numRounds, numCourts){
  const benchCount = Array(n).fill(0);
  const partnerCount = Array.from({length:n}, ()=>Array(n).fill(0));
  const opponentCount = Array.from({length:n}, ()=>Array(n).fill(0));
  const schedule = [];
  let cycleLength = null;
  const candidates = [...Array(n).keys()];

  for(let r=0; r<numRounds; r++){
    if(cycleLength === null){
      const round = generateFreshRound(candidates, numCourts, benchCount, partnerCount, opponentCount);
      if(round){ schedule.push(round); continue; }
      cycleLength = schedule.length || 1;
    }
    const round = cloneRound(schedule[r % cycleLength]);
    applyRoundCounts(round, benchCount, partnerCount, opponentCount);
    schedule.push(round);
  }
  return {schedule, cycleLength};
}

// Replays existing schedule to rebuild count matrices, used when adding a round later
function replayCounts(n, numCourts, schedule){
  const benchCount = Array(n).fill(0);
  const partnerCount = Array.from({length:n}, ()=>Array(n).fill(0));
  const opponentCount = Array.from({length:n}, ()=>Array(n).fill(0));
  schedule.forEach(round=> applyRoundCounts(round, benchCount, partnerCount, opponentCount));
  return {benchCount, partnerCount, opponentCount};
}

/* ---------- KNOCKOUT STAGE ---------- */
function findKoMatch(id){
  if(!state.knockout) return null;
  for(const round of state.knockout.rounds){
    const m = round.matches.find(mm=>mm.id===id);
    if(m) return m;
  }
  return null;
}

// Returns the 2-player team ([idxA, idxB]) for a ref, or null if not yet decided.
function resolveTeamRef(ref){
  if(!ref) return null;
  if(ref.type === 'seed') return state.knockout.seeds[ref.n];
  if(ref.type === 'winner'){
    const m = findKoMatch(ref.id);
    if(!m || m.score.a === null || m.score.a === '') return null;
    const target = state.pointsTarget;
    const a = +m.score.a, b = target - a;
    if(a === b) return null;
    return resolveTeamRef(a > b ? m.a : m.b);
  }
  return null;
}
function resolveLoserTeam(matchId){
  const m = findKoMatch(matchId);
  if(!m || m.score.a === null || m.score.a === '') return null;
  const target = state.pointsTarget;
  const a = +m.score.a, b = target - a;
  if(a === b) return null;
  return resolveTeamRef(a > b ? m.b : m.a);
}

// Pairs individual leaderboard ranks into 2-player teams for the bracket,
// using snake seeding (rank1+rankLast, rank2+rankSecondLast, ...) so each
// team combines a stronger and weaker finisher for balance.
function buildKoTeams(lb, teamCount){
  const teams = [];
  for(let k=0; k<teamCount; k++){
    teams.push([lb[k].idx, lb[teamCount*2 - 1 - k].idx]);
  }
  return teams;
}

function generateKnockout(stage){
  const lb = computeLeaderboard().filter(p=>p.played>0 && !p.removed);
  let seeds, rounds;
  if(stage === 'quarterfinal'){
    if(lb.length < 16){ alert('You need at least 16 players with recorded results to form 8 two-player teams for the Quarterfinal stage.'); return; }
    seeds = buildKoTeams(lb, 8);
    rounds = [
      {name:'Quarterfinal', matches:[
        {id:'QF1', a:{type:'seed',n:0}, b:{type:'seed',n:2}, score:{a:null}},
        {id:'QF2', a:{type:'seed',n:1}, b:{type:'seed',n:3}, score:{a:null}},
        {id:'QF3', a:{type:'seed',n:4}, b:{type:'seed',n:6}, score:{a:null}},
        {id:'QF4', a:{type:'seed',n:5}, b:{type:'seed',n:7}, score:{a:null}}
      ]},
      {name:'Semifinal', matches:[
        {id:'SF1', a:{type:'winner',id:'QF1'}, b:{type:'winner',id:'QF2'}, score:{a:null}},
        {id:'SF2', a:{type:'winner',id:'QF3'}, b:{type:'winner',id:'QF4'}, score:{a:null}}
      ]},
      {name:'Final', matches:[
        {id:'F1', a:{type:'winner',id:'SF1'}, b:{type:'winner',id:'SF2'}, score:{a:null}}
      ]}
    ];
  } else if(stage === 'semifinal'){
    if(lb.length < 8){ alert('You need at least 8 players with recorded results to form 4 two-player teams for the Semifinal stage.'); return; }
    seeds = buildKoTeams(lb, 4);
    rounds = [
      {name:'Semifinal', matches:[
        {id:'SF1', a:{type:'seed',n:0}, b:{type:'seed',n:3}, score:{a:null}},
        {id:'SF2', a:{type:'seed',n:1}, b:{type:'seed',n:2}, score:{a:null}}
      ]},
      {name:'Final', matches:[
        {id:'F1', a:{type:'winner',id:'SF1'}, b:{type:'winner',id:'SF2'}, score:{a:null}}
      ]}
    ];
  } else {
    if(lb.length < 8){ alert('You need at least 8 players with recorded results to form 4 two-player teams for the Final stage.'); return; }
    seeds = buildKoTeams(lb, 4);
    rounds = [
      {name:'Final Stage', matches:[
        {id:'SF1', a:{type:'seed',n:0}, b:{type:'seed',n:3}, score:{a:null}},
        {id:'SF2', a:{type:'seed',n:1}, b:{type:'seed',n:2}, score:{a:null}}
      ]},
      {name:'Final', matches:[
        {id:'F1', a:{type:'winner',id:'SF1'}, b:{type:'winner',id:'SF2'}, score:{a:null}}
      ]}
    ];
  }
  state.knockout = {stage, seeds, rounds};
  saveState();
  render();
}

function tierLabel(roundName){
  if(roundName === 'Quarterfinal') return 'Quarterfinalists (5th\u20138th)';
  if(roundName === 'Semifinal' || roundName === 'Final Stage') return 'Semifinalists (3rd\u20134th)';
  return roundName;
}

function computeKnockoutStandings(){
  if(!state.knockout) return [];
  const rounds = state.knockout.rounds;
  const tiers = [];
  const finalMatch = rounds[rounds.length-1].matches[0];
  tiers.push({label:'Champion', teams:[resolveTeamRef({type:'winner', id:finalMatch.id})]});
  tiers.push({label:'Runner-up', teams:[resolveLoserTeam(finalMatch.id)]});
  for(let ri=rounds.length-2; ri>=0; ri--){
    const round = rounds[ri];
    tiers.push({label:tierLabel(round.name), teams: round.matches.map(m=>resolveLoserTeam(m.id))});
  }
  return tiers;
}

function teamName(team){
  if(!team) return 'TBD';
  return team.map(idx=>state.players[idx]).join(' + ');
}

function renderKnockoutStandings(container){
  if(!container) return;
  const tiers = computeKnockoutStandings();
  let html = `<div class="section-title" style="margin-bottom:10px;"><span>KNOCKOUT STANDINGS</span></div>`;
  tiers.forEach(tier=>{
    const names = tier.teams.map(teamName).join(' &nbsp;/&nbsp; ');
    html += `<div class="lb-row"><div class="lb-name" style="cursor:default;">${escapeHtml(tier.label)}</div><div class="lb-stats" style="max-width:60%; white-space:normal; text-align:right;">${names}</div></div>`;
  });
  container.innerHTML = `<div style="margin-bottom:18px;">${html}</div>`;
}

function renderKoMatchCard(m){
  const el = document.createElement('div');
  el.className = 'match';
  const target = state.pointsTarget;
  const teamA = resolveTeamRef(m.a);
  const teamB = resolveTeamRef(m.b);
  const ready = teamA !== null && teamB !== null;
  const nameA = teamName(teamA);
  const nameB = teamName(teamB);
  const aVal = m.score.a;
  const oppVal = (aVal===null || aVal==='') ? '&mdash;' : (target - (+aVal));
  let winnerSide = null;
  if(ready && aVal!==null && aVal!==''){
    const a = +aVal, b = target - a;
    if(a>b) winnerSide='a'; else if(b>a) winnerSide='b';
  }
  const tie = ready && aVal!==null && aVal!=='' && winnerSide===null;
  el.innerHTML = `
    <div class="court">${escapeHtml(m.id)}</div>
    <div class="teams">
      <div class="team ${winnerSide==='a'?'ko-winner':''}">${escapeHtml(nameA)}</div>
      <input type="number" min="0" max="${target}" class="score-input" data-koid="${m.id}" value="${aVal===null?'':aVal}" placeholder="&mdash;" ${ready?'':'disabled'} />
      <span class="vs">:</span>
      <span class="opp-score">${oppVal}</span>
      <div class="team ${winnerSide==='b'?'ko-winner':''}" style="text-align:right;">${escapeHtml(nameB)}</div>
    </div>
    ${!ready ? '<div class="hint ko-wait-hint" style="margin-top:8px; margin-bottom:0;">Waiting for previous match result&hellip;</div>' : ''}
    ${tie ? '<div class="hint ko-tie-hint" style="margin-top:8px; margin-bottom:0; color:var(--danger);">Scores are tied &mdash; adjust to declare a winner.</div>' : ''}
  `;
  const inp = el.querySelector('.score-input');
  if(inp && !inp.disabled){
    inp.addEventListener('input', e=>{
      const val = e.target.value;
      m.score.a = (val==='') ? null : Math.max(0, Math.min(target, +val));
      saveState();
      updateAfterKoScoreChange(m.id, e.target);
    });
  }
  return el;
}

function updateAfterKoScoreChange(matchId, inputEl){
  const target = state.pointsTarget;
  const m = findKoMatch(matchId);
  const val = m.score.a;
  const matchEl = inputEl.closest('.match');
  matchEl.querySelector('.opp-score').textContent = (val===null||val==='') ? '\u2014' : (target-(+val));

  const teamEls = matchEl.querySelectorAll('.team');
  teamEls.forEach(te=>te.classList.remove('ko-winner'));
  let tieNeeded = false;
  if(val!==null && val!==''){
    const a=+val, b=target-a;
    if(a>b) teamEls[0].classList.add('ko-winner');
    else if(b>a) teamEls[1].classList.add('ko-winner');
    else tieNeeded = true;
  }
  let hintEl = matchEl.querySelector('.ko-tie-hint');
  if(tieNeeded){
    if(!hintEl){
      hintEl = document.createElement('div');
      hintEl.className = 'hint ko-tie-hint';
      hintEl.style.marginTop='8px'; hintEl.style.marginBottom='0'; hintEl.style.color='var(--danger)';
      hintEl.textContent = 'Scores are tied \u2014 adjust to declare a winner.';
      matchEl.appendChild(hintEl);
    }
  } else if(hintEl){
    hintEl.remove();
  }

  refreshDownstreamKoRounds(matchId);
  refreshKoStandings();
}

function refreshKoStandings(){
  const holder = document.getElementById('koStandingsHolder');
  if(holder) renderKnockoutStandings(holder);
}

function refreshDownstreamKoRounds(matchId){
  const rounds = state.knockout.rounds;
  const roundIdx = rounds.findIndex(r=> r.matches.some(mm=>mm.id===matchId));
  const roundEls = document.querySelectorAll('.ko-round-block');
  for(let ri=roundIdx+1; ri<rounds.length; ri++){
    const roundEl = roundEls[ri];
    if(roundEl){
      const grid = roundEl.querySelector('.matches-grid');
      grid.innerHTML = '';
      rounds[ri].matches.forEach(m2=> grid.appendChild(renderKoMatchCard(m2)));
    }
  }
}

/* ---------- PLAYING ---------- */
function computeLeaderboard(){
  const n = state.players.length;
  const stats = Array.from({length:n}, ()=>({points:0, against:0, wins:0, played:0}));
  state.schedule.forEach((round,ri)=>{
    round.matches.forEach((m,mi)=>{
      const sc = state.scores[ri][mi];
      if(sc.a === null || sc.a === undefined || sc.a === '') return;
      const a = +sc.a, b = state.pointsTarget - a;
      const [a1,a2]=m.teamA, [b1,b2]=m.teamB;
      stats[a1].points+=a; stats[a2].points+=a; stats[b1].points+=b; stats[b2].points+=b;
      stats[a1].against+=b; stats[a2].against+=b; stats[b1].against+=a; stats[b2].against+=a;
      stats[a1].played++; stats[a2].played++; stats[b1].played++; stats[b2].played++;
      if(a>b){ stats[a1].wins++; stats[a2].wins++; } else if(b>a){ stats[b1].wins++; stats[b2].wins++; }
    });
  });
  return state.players.map((name,i)=>({name, idx:i, removed: state.removed.includes(i), ...stats[i]})).sort((x,y)=>{
    if(state.rankBy === 'diff'){
      return (y.points-y.against) - (x.points-x.against) || y.points-x.points || y.wins-x.wins;
    }
    return y.points-x.points || y.wins-x.wins;
  });
}

function activePlayerIndices(){
  return state.players.map((_,i)=>i).filter(i=>!state.removed.includes(i));
}

// Soft-removes a player from future scheduling: their slot and past results
// stay put (so already-played rounds and their earned points don't shift or
// vanish), but they're dropped from the candidate pool for any round that
// hasn't been played yet. The round currently in progress is left exactly as
// scheduled — only fully-untouched rounds after it are discarded so the next
// "+ Add round" rebuilds them without this player.
function removePlayerFromRotation(idx){
  const name = state.players[idx] || 'This player';
  if(!confirm(`Remove ${name} from the rotation?\n\nPoints they've already earned stay on the leaderboard. The round currently in progress won't change — only rounds after it will be rebuilt without them.`)) return;

  state.removed.push(idx);

  if(state.schedule && state.schedule.length){
    let currentRoundIdx = state.schedule.findIndex((round, ri)=>
      round.matches.some((m, mi)=> state.scores[ri][mi].a === null || state.scores[ri][mi].a === '')
    );
    if(currentRoundIdx === -1) currentRoundIdx = state.schedule.length - 1;
    state.schedule.length = currentRoundIdx + 1;
    state.scores.length = currentRoundIdx + 1;
    state.numRounds = state.schedule.length;
    state.cycleLength = null;
  }

  saveState();
  render();
}

function importStateFromFile(file){
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed.players || !parsed.stage){ throw new Error('bad file'); }
      if(parsed.sessionMinutes === undefined) parsed.sessionMinutes = 120;
      if(parsed.knockout === undefined) parsed.knockout = null;
      if(parsed.removed === undefined) parsed.removed = [];
      if(parsed.rankBy === undefined) parsed.rankBy = 'points';
      if(parsed.knockout && !(Array.isArray(parsed.knockout.seeds) && parsed.knockout.seeds.every(s=>Array.isArray(s) && s.length===2))){
        parsed.knockout = null;
      }
      state = parsed;
      saveState();
      render();
    }catch(err){
      alert('Could not read this file \u2014 it does not look like a valid Sterling Americano export.');
    }
  };
  reader.readAsText(file);
}

function exportState(){
  const safeName = (state.tournamentName || 'americano').replace(/[^a-z0-9]+/gi,'_').toLowerCase();
  const safeDate = (state.date || '').replace(/[^a-z0-9]+/gi,'_').toLowerCase();
  const filename = `${safeName}_${safeDate}.json`;
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderLeaderboard(container){
  const lb = computeLeaderboard();
  const hasData = lb.some(p=>p.played>0);

  const listHtml = !hasData
    ? '<div class="empty">Enter round 1 scores to see the leaderboard</div>'
    : lb.map((p,i)=>{
        const cls = i===0?'top1':i===1?'top2':i===2?'top3':'';
        const diff = p.points - p.against;
        const diffStr = diff>0 ? ('+'+diff) : String(diff);
        const diffClass = diff>0 ? 'diff-pos' : (diff<0 ? 'diff-neg' : '');
        return `
        <div class="lb-row ${cls}" style="${p.removed ? 'opacity:.5;' : ''}">
          <div class="lb-rank">${i+1}</div>
          <div class="lb-name-col">
            <div class="lb-name" data-idx="${p.idx}" title="Click to rename">${escapeHtml(p.name)}</div>
            <div class="lb-sub">${p.removed ? 'Left rotation &middot; ' : ''}${p.wins}W &middot; ${p.played} played</div>
          </div>
          <div class="lb-points-col">
            <div class="lb-points">${p.points}</div>
            <div class="lb-sub">W ${p.points} &middot; L ${p.against} &middot; <span class="${diffClass}">${diffStr}</span></div>
          </div>
          ${p.removed ? '' : `<button class="lb-remove" data-idx="${p.idx}" title="Remove from rotation">&#10005;</button>`}
        </div>`;
      }).join('');

  container.innerHTML = `
    <div id="lbList">${listHtml}</div>
    <div class="lb-add-row">
      <button id="lbAddPlayerBtn" class="small ghost">+ Add player</button>
    </div>
  `;

  container.querySelectorAll('.lb-name').forEach(nameEl=>{
    nameEl.addEventListener('click', ()=>{
      const idx = +nameEl.dataset.idx;
      const current = state.players[idx];

      const wrapEl = document.createElement('span');
      wrapEl.style.display = 'flex';
      wrapEl.style.gap = '6px';
      wrapEl.style.flex = '1';
      wrapEl.style.alignItems = 'center';

      const input = document.createElement('input');
      input.type = 'text'; input.value = current; input.className = 'lb-name-input';
      input.style.flex = '1';

      const saveBtn = document.createElement('button');
      saveBtn.textContent = '\u2713';
      saveBtn.className = 'small';
      saveBtn.style.padding = '6px 10px';

      wrapEl.appendChild(input);
      wrapEl.appendChild(saveBtn);
      nameEl.replaceWith(wrapEl);
      input.focus(); input.select();

      let committed = false;
      const commit = ()=>{
        if(committed) return;
        committed = true;
        const val = input.value.trim();
        if(val) state.players[idx] = val;
        saveState();
        render();
      };
      saveBtn.addEventListener('click', commit);
      input.addEventListener('blur', ()=> setTimeout(commit, 150));
      input.addEventListener('keydown', e=>{
        if(e.key === 'Enter') commit();
        if(e.key === 'Escape'){ committed = true; render(); }
      });
    });
  });

  container.querySelectorAll('.lb-remove').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      removePlayerFromRotation(+btn.dataset.idx);
    });
  });

  const addBtn = container.querySelector('#lbAddPlayerBtn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      const name = prompt('New player name:');
      if(name && name.trim()){
        state.players.push(name.trim());
        saveState();
        render();
      }
    });
  }
}

function renderPodium(container){
  if(!container) return;
  const lb = computeLeaderboard();
  const top3 = lb.slice(0,3);
  if(top3.length < 3){
    container.innerHTML = '<div class="empty">Not enough completed matches to determine a podium.</div>';
    return;
  }
  const [first, second, third] = top3;
  container.innerHTML = `
    <div class="podium-wrap">
      <div class="podium-title">&#127942; Final Podium</div>
      <div class="podium">
        <div class="podium-card podium-silver">
          <span class="medal">&#129352;</span>
          <div class="rank-label">2nd place</div>
          <div class="name">${escapeHtml(second.name)}</div>
          <div class="pts">${second.points}</div>
        </div>
        <div class="podium-card podium-gold">
          <span class="medal">&#129351;</span>
          <div class="rank-label">1st place</div>
          <div class="name">${escapeHtml(first.name)}</div>
          <div class="pts">${first.points}</div>
        </div>
        <div class="podium-card podium-bronze">
          <span class="medal">&#129353;</span>
          <div class="rank-label">3rd place</div>
          <div class="name">${escapeHtml(third.name)}</div>
          <div class="pts">${third.points}</div>
        </div>
      </div>
    </div>
  `;
}

// From how many rounds onward Americano starts offering a standings-based
// "balanced" alternative alongside the usual partner-rotation round.
const BALANCED_ROUND_FROM = 8;
// Minimum number of rounds that must separate two sit-outs of the same
// player (a gap of 3 means at least 2 rounds actually played in between).
const MIN_ROUNDS_BETWEEN_SITOUTS = 3;

function commitNewRound(round){
  state.schedule.push(round);
  state.scores.push(round.matches.map(()=>({a:null})));
  state.numRounds = state.schedule.length;
  saveState();
  render();
}

function renderRounds(container){
  container.innerHTML = '';
  state.schedule.forEach((round,ri)=>{
    container.appendChild(renderRoundBlock(round, ri));
  });
  const addRow = document.createElement('div');
  addRow.className = 'add-round-row';
  addRow.innerHTML = `<button id="addRoundBtn" class="primary small">+ Add round</button>`;
  container.appendChild(addRow);
  addRow.querySelector('#addRoundBtn').addEventListener('click', ()=>{
    const n = state.players.length;
    const candidates = activePlayerIndices();

    if(state.tournamentType === 'mexicano'){
      const lastScores = state.scores[state.scores.length-1];
      const incomplete = lastScores.some(sc=> sc.a===null || sc.a==='');
      if(incomplete && !confirm('Not every score in the last round has been entered yet, so standings are incomplete. Add the next round anyway?')) return;
      const {benchCount} = replayCounts(n, state.numCourts, state.schedule);
      const rankOrder = computeLeaderboard().map(p=>p.idx).filter(i=>candidates.includes(i));
      const newRound = generateMexicanoRound(rankOrder.length, state.numCourts, benchCount, rankOrder);
      commitNewRound(newRound);
      return;
    }

    const {benchCount, partnerCount, opponentCount} = replayCounts(n, state.numCourts, state.schedule);
    let freshRound = state.cycleLength ? null : generateFreshRound(candidates, state.numCourts, benchCount, partnerCount, opponentCount);
    if(!freshRound){
      // Partner rotation exhausted (or already known to be): replay it
      // from Round 1 instead of repeating a partnership early.
      if(!state.cycleLength) state.cycleLength = state.schedule.length || 1;
      freshRound = cloneRound(state.schedule[state.schedule.length % state.cycleLength]);
      applyRoundCounts(freshRound, benchCount, partnerCount, opponentCount);
    }

    if(state.schedule.length >= BALANCED_ROUND_FROM){
      // Offer a second, standings-based lineup for the same round — same
      // players rest either way, only the on-court pairing differs — and
      // let the organizer pick which one to actually add.
      const rankOrder = computeLeaderboard().map(p=>p.idx).filter(i=>candidates.includes(i));
      const balancedRound = generateBalancedRoundWithBench(freshRound.bench, rankOrder);
      renderRoundChoice(addRow, freshRound, balancedRound);
      return;
    }

    commitNewRound(freshRound);
  });

  renderKnockoutSection(container);
}

function matchesPreviewHtml(round){
  const lines = round.matches.map(m=>{
    const [a1,a2]=m.teamA, [b1,b2]=m.teamB;
    return `<div class="rc-line"><span class="court-no">Court ${m.court}</span>${escapeHtml(state.players[a1])} + ${escapeHtml(state.players[a2])}<span class="vs">vs</span>${escapeHtml(state.players[b1])} + ${escapeHtml(state.players[b2])}</div>`;
  }).join('');
  const bench = round.bench.length
    ? `<div class="bench">Resting: ${round.bench.map(i=>escapeHtml(state.players[i])).join(', ')}</div>`
    : '';
  return `<div class="rc-lines">${lines}</div>${bench}`;
}

function renderRoundChoice(addRow, freshRound, balancedRound){
  addRow.innerHTML = `
    <div class="round-choice">
      <div class="round-choice-title">Round ${state.schedule.length + 1} &mdash; choose a lineup</div>
      <div class="round-choice-grid matches-grid">
        <div class="match round-choice-option">
          <div class="rc-label">Partner rotation</div>
          ${matchesPreviewHtml(freshRound)}
          <button class="small accent rc-pick" data-choice="fresh">Use this lineup</button>
        </div>
        <div class="match round-choice-option">
          <div class="rc-label">Balanced by standings</div>
          ${matchesPreviewHtml(balancedRound)}
          <button class="small accent rc-pick" data-choice="balanced">Use this lineup</button>
        </div>
      </div>
      <div class="hint" style="text-align:center;">Same players rest either way &mdash; only the on-court pairing differs.</div>
    </div>
  `;
  addRow.querySelector('[data-choice="fresh"]').addEventListener('click', ()=> commitNewRound(freshRound));
  addRow.querySelector('[data-choice="balanced"]').addEventListener('click', ()=> commitNewRound(balancedRound));
}

// Finds every case where the same player is benched again before at least
// MIN_ROUNDS_BETWEEN_SITOUTS-1 rounds have actually been played in between
// — e.g. deleting/adding rounds by hand can break the fair rest rotation
// even though each round on its own still looks balanced.
function findBenchSpacingViolations(){
  const lastBenchRound = {};
  const violations = [];
  state.schedule.forEach((round, ri)=>{
    round.bench.forEach(p=>{
      if(lastBenchRound[p] !== undefined){
        const gap = ri - lastBenchRound[p];
        if(gap < MIN_ROUNDS_BETWEEN_SITOUTS){
          violations.push({player:p, prevRound:lastBenchRound[p], round:ri, playedBetween:gap-1});
        }
      }
      lastBenchRound[p] = ri;
    });
  });
  return violations;
}

function renderBenchWarnings(container){
  if(!container) return;
  const violations = findBenchSpacingViolations();
  if(!violations.length){ container.innerHTML = ''; return; }
  const items = violations.map(v=>{
    const name = escapeHtml(state.players[v.player]);
    return `<b>${name}</b> in R${v.round+1}`;
  }).join(', ');
  container.innerHTML = `
    <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
      <div style="font-size:10px; font-weight:700; color:var(--danger); letter-spacing:.05em; text-transform:uppercase; margin-bottom:5px;">&#9888;&#65039; Uneven rest</div>
      <div style="font-size:11.5px; color:var(--muted); line-height:1.5;">${items}</div>
    </div>
  `;
}

function renderRoundBlock(round, ri){
  const block = document.createElement('div');
  block.className = 'round-block';
  block.dataset.ri = ri;
  const allPlayed = round.matches.every((m,mi)=> state.scores[ri][mi].a !== null && state.scores[ri][mi].a !== '');
  block.innerHTML = `
    <div class="round-title">
      <div class="left"><span>Round ${ri+1}</span>${allPlayed ? '<span class="played-badge">complete</span>' : ''}</div>
      <button class="del-round" data-ri="${ri}">Delete round</button>
    </div>
  `;
  const grid = document.createElement('div');
  grid.className = 'matches-grid';
  round.matches.forEach((m,mi)=>{
    const [a1,a2]=m.teamA, [b1,b2]=m.teamB;
    const sc = state.scores[ri][mi];
    const el = document.createElement('div');
    el.className = 'match';
    const oppVal = (sc.a===null||sc.a==='') ? '\u2014' : (state.pointsTarget - (+sc.a));
    el.innerHTML = `
      <div class="court">COURT ${m.court}</div>
      <div class="teams">
        <div class="team">${escapeHtml(state.players[a1])} + ${escapeHtml(state.players[a2])}</div>
        <input type="number" min="0" max="${state.pointsTarget}" class="score-input" data-ri="${ri}" data-mi="${mi}" value="${sc.a===null?'':sc.a}" placeholder="\u2014" />
        <span class="vs">:</span>
        <span class="opp-score">${oppVal}</span>
        <div class="team" style="text-align:right;">${escapeHtml(state.players[b1])} + ${escapeHtml(state.players[b2])}</div>
      </div>
    `;
    grid.appendChild(el);
  });
  block.appendChild(grid);
  if(round.bench.length){
    const b = document.createElement('div');
    b.className = 'bench';
    b.textContent = 'Resting: ' + round.bench.map(i=>state.players[i]).join(', ');
    block.appendChild(b);
  }

  block.querySelector('.del-round').addEventListener('click', ()=>{
    if(!confirm(`Delete Round ${ri+1}? This cannot be undone.`)) return;
    state.schedule.splice(ri,1);
    state.scores.splice(ri,1);
    state.numRounds = state.schedule.length;
    state.cycleLength = null;
    saveState();
    render();
  });

  block.querySelectorAll('.score-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const _ri = +e.target.dataset.ri, mi = +e.target.dataset.mi;
      const val = e.target.value;
      state.scores[_ri][mi].a = (val==='') ? null : Math.max(0, Math.min(state.pointsTarget, +val));
      saveState();
      updateAfterScoreChange(_ri, mi, e.target);
    });
  });

  return block;
}

function updateAfterScoreChange(ri, mi, inputEl){
  const sc = state.scores[ri][mi];
  const matchEl = inputEl.closest('.match');
  const oppSpan = matchEl.querySelector('.opp-score');
  oppSpan.textContent = (sc.a===null || sc.a==='') ? '\u2014' : (state.pointsTarget - (+sc.a));

  const roundBlock = inputEl.closest('.round-block');
  const rIdx = +roundBlock.dataset.ri;
  const round = state.schedule[rIdx];
  const allPlayed = round.matches.every((m,i)=> state.scores[rIdx][i].a !== null && state.scores[rIdx][i].a !== '');
  const leftDiv = roundBlock.querySelector('.round-title .left');
  leftDiv.innerHTML = `<span>Round ${rIdx+1}</span>${allPlayed ? '<span class="played-badge">complete</span>' : ''}`;

  const lbContainer = document.getElementById('leaderboard');
  if(lbContainer) renderLeaderboard(lbContainer);

  const podiumHolder = document.getElementById('podiumHolder');
  if(podiumHolder) renderPodium(podiumHolder);
}

render();
</script>
</body>
</html>
